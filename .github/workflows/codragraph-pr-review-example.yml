# Example workflow: post a CodraGraph structural-diff comment on every PR.
#
# This is a SAMPLE — copy it into your own repo and adapt as needed. To
# enable it in this repo, rename to `codragraph-pr-review.yml` (drop the
# `-example` suffix) and uncomment the `on:` block below.
#
# For LLM-augmented mode, switch `mode: deterministic` to `mode: review` and
# pass `anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}`.

name: CodraGraph PR Review (example)

# Disabled by default in this repo — sample only. Remove the `if: false`
# guard (or rename this file) to activate.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  codragraph-review:
    if: false # ← remove this line to enable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required: full history so we can check out base + head shas.
          fetch-depth: 0

      - uses: ./.github/actions/codragraph-pr-review
        with:
          mode: deterministic
          # For LLM-augmented review:
          # mode: review
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # anthropic-model: claude-sonnet-4-6
