name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + format check (cheap, fail-fast) ───────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  # ── Typecheck across every workspace package ─────────────────────
  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: tsc all packages
        run: |
          set -e
          for pkg in codragraph-shared codragraph-graphstore codragraph-harness codragraph-compress codragraph-sdk codragraph; do
            if [ -f "$pkg/tsconfig.json" ]; then
              echo "::group::tsc $pkg"
              (cd "$pkg" && npx tsc --noEmit)
              echo "::endgroup::"
            fi
          done
          echo "::group::tsc codragraph-web (app)"
          (cd codragraph-web && npx tsc --noEmit -p tsconfig.app.json)
          echo "::endgroup::"

  # ── Unit / integration tests for the publishable packages ────────
  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: graphstore tests
        run: npm test --workspace codragraph-graphstore
      - name: harness tests
        run: npm test --workspace codragraph-harness

  # ── Build all publishable packages → ensures `npm publish` works ──
  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build publishable packages
        run: |
          set -e
          for pkg in codragraph-shared codragraph-graphstore codragraph-harness codragraph-compress codragraph-sdk codragraph; do
            echo "::group::build $pkg"
            npm run build --workspace "$pkg"
            echo "::endgroup::"
          done
      - name: Pack (dry run — exercises publishConfig + files allow-list)
        run: |
          set -e
          for pkg in codragraph-graphstore codragraph-harness codragraph-compress codragraph-sdk codragraph; do
            echo "::group::npm pack --dry-run $pkg"
            npm pack --workspace "$pkg" --dry-run
            echo "::endgroup::"
          done
